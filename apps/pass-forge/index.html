<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>PassForge temporarily unavailable</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0a0a0b;
            color: #f0f0f5;
        }
        main {
            max-width: 680px;
            margin: 24px;
            padding: 32px;
            border: 1px solid #2a2a32;
            border-radius: 18px;
            background: #141417;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        }
        h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3rem); }
        p { color: #c4c4d4; line-height: 1.65; font-size: 1.05rem; }
        .accent { color: #ff6b35; }
        .notice {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255, 107, 53, 0.10);
            border: 1px solid rgba(255, 107, 53, 0.25);
        }
        a { color: #ff8c42; }
    </style>
</head>
<body>
    <main>
        <h1>Pass<span class="accent">Forge</span></h1>
        <p>PassForge is temporarily unavailable while payment processing is reviewed.</p>
        <div class="notice">
            <p>No purchases are being accepted from this page. The previous checkout link has been removed from this source file and the related Stripe payment link is inactive.</p>
        </div>
        <p><a href="https://simplereally.github.io/">Return to Simplereally tools</a></p>
    </main>
</body>
</html>
